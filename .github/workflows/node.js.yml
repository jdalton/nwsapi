name: nwsapi

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}
      - run: npm install --global pnpm@12.3.4
        working-directory: ${{ runner.temp }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run type
      - run: pnpm run test:package
      - run: pnpm run upstream:clone
      - run: pnpm run upstream:verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:coverage
      - run: pnpm run check:coverage
      - run: pnpm run test:browser
      - run: NWSAPI_MINIFIED=1 pnpm run test:upstream
